name: music_career_sim
description: Music Career Simulator — a single-player music career game.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  game: any
  path_provider: ^2.1.0
  sqlite3_flutter_libs: ^0.5.0
  image_picker: ^1.2.4
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree_400Regular.ttf
        - asset: assets/fonts/Figtree_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Figtree_900Black.ttf
          weight: 900
    # Plaque dedications (docs K209); a variable font, weights by axis.
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville_Variable.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed_700Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed_800ExtraBold.ttf
          weight: 800
