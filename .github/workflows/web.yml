# Builds the web version and publishes it on GitHub Pages (docs/web.md).
name: Web

on:
  push:
    branches: [claude/nifty-archimedes-pceuh4]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Publish without running the tests (emergencies only)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The tests run first (docs K309): a change that breaks the game does
  # not reach the players. The three run side by side.
  test-sim:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Simulation and saves
        run: |
          sudo apt-get install -y libsqlite3-dev
          flutter pub get
          (cd packages/simulation_core && dart analyze && dart test -r failures-only)
          (cd packages/persistence && dart test -r failures-only)

  test-game:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Game sessions
        run: |
          sudo apt-get install -y libsqlite3-dev
          flutter pub get
          cd packages/game
          dart analyze
          dart test -r failures-only

  test-app:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: App
        working-directory: app
        run: |
          sudo apt-get install -y libsqlite3-dev
          flutter pub get
          flutter analyze
          flutter test

  build:
    needs: [test-sim, test-game, test-app]
    # Skipped tests (the emergency switch) let it through; failed ones not.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          # The release's id (docs K242): the game checks build.txt for a
          # newer one, and the code files carry it so a browser never mixes
          # a new page with code it cached from an older release.
          V=${GITHUB_SHA::12}
          flutter build web --wasm --base-href /Music-career-sim/ --dart-define=BUILD_ID=$V
          echo "$V" > build/web/build.txt
          sed -i "s#\"main.dart.wasm\"#\"main.dart.wasm?v=$V\"#g; s#\"main.dart.mjs\"#\"main.dart.mjs?v=$V\"#g; s#\"main.dart.js\"#\"main.dart.js?v=$V\"#g" build/web/flutter_bootstrap.js
          sed -i "s#\"flutter_bootstrap.js\"#\"flutter_bootstrap.js?v=$V\"#" build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
